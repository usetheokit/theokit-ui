name: Deploy Registry to GitHub Pages

# T1.2 (agent-team-audit-fixes plan): publish registry/r/*.json to GitHub
# Pages so the shadcn copy-paste path (`npx shadcn@latest add
# <url>/r/<name>.json`) actually resolves. Functional URL is
# https://usetheokit.github.io/theokit-ui/r/<name>.json — the brand URL
# https://ui.usetheo.dev/r/<name>.json is a DNS CNAME away (config'd
# separately at the registrar/CDN level).

on:
  push:
    branches:
      - main
    paths:
      - "packages/ui/registry/**"
      - "packages/ui/src/**"
      - "packages/ui/package.json"
      - "package.json"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

# Workflow-level permissions are the floor every job inherits. `pages: write` and
# `id-token: write` belong only to the job that deploys — granting them here hands
# them to the build job too, which runs project code and third-party dependencies.
permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-registry:
    name: Build the registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `@v1` is a moving ref by design; what the action RUNS stays pinned by digest inside it,
      # Node from `.nvmrc`, pnpm from `packageManager`. The frozen install is the action's
      # default, so the separate step is gone.
      #
      # THE THIRD CACHE PATH IS DROPPED ON PURPOSE — see the fuller note in `deploy-ladle.yml`.
      # Short version: measured over the last twenty commits touching `packages/ui/package.json`,
      # 19 changed it without touching the lockfile, and every one of those changed `"version"` or
      # `"sideEffects"`. Neither alters the pnpm store, so the third path discarded a warm store
      # on every release and protected nothing.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]

      - name: Build registry
        run: pnpm registry:build

      - name: Validate registry
        run: pnpm registry:validate

      - name: Prepare site directory
        run: |
          mkdir -p _site/r
          cp -r registry/r/* _site/r/
          cp registry/index.json _site/index.json
          # Landing page so /index.html doesn't 404.
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>@theokit/ui — registry</title>
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 40px auto; max-width: 720px; padding: 0 20px; color: #111; }
              code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
              a { color: #7c3aed; }
            </style>
          </head>
          <body>
            <h1>@theokit/ui — registry</h1>
            <p>shadcn-compatible component registry for <a href="https://github.com/usetheokit/theokit-ui">@theokit/ui</a>.</p>
            <p>Install any component:</p>
            <pre><code>npx shadcn@latest add https://usetheokit.github.io/theokit-ui/r/chat-message.json</code></pre>
            <p>See the <a href="index.json">catalog index</a> for all __ITEM_COUNT__ items.</p>
            <hr />
            <p>npm: <a href="https://www.npmjs.com/package/@theokit/ui"><code>pnpm add @theokit/ui</code></a></p>
          </body>
          </html>
          HTML
          # The item count is derived from the published index so the landing
          # page cannot drift from the catalog it links to.
          COUNT=$(node -e "const i=require('./registry/index.json');console.log(Array.isArray(i)?i.length:i.items.length)")
          sed -i "s/__ITEM_COUNT__/${COUNT}/" _site/index.html
          # Fail loudly if the advertised install example is not in the catalog.
          test -f _site/r/chat-message.json
          echo "landing page: ${COUNT} items"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/ui/_site

  deploy:
    name: Deploy the registry
    needs: build-registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write      # actions/deploy-pages publishes the artifact
      id-token: write   # and proves this run's identity to the Pages service
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
