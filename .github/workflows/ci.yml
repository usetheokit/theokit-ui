name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    # `master` used to be listed here and this repository has never had one — its branches are
    # main, develop and workspace. A trigger naming a branch that does not exist is not an error
    # anywhere; it simply never fires, and reads like coverage.
    #
    # `develop` is the branch that was missing. Both promotion legs are pull requests
    # (workspace -> develop, develop -> main) and those are covered below, but a push that lands
    # on develop — a back-merge, a direct correction — left no record of what develop passed.
    branches:
      - main
      - develop

# Deny by default. Without this block the workflow inherits whatever the repository default is,
# which on older repositories is write access to everything -- and the inheritance is silent,
# so nothing in the file shows what a job was actually granted.
#
# Verified before adding rather than assumed safe: every job in this file already declares its
# own `contents: read`, so no job is losing a permission it uses today. What this adds is the
# floor for the NEXT job somebody writes here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  static:
    permissions:
      contents: read
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - run: pnpm --filter=@theokit/ui format:check
      - run: pnpm --filter=@theokit/ui lint:ci
      - run: pnpm --filter=@theokit/ui validate:naming
      - run: pnpm --filter=@theokit/ui typecheck
      - run: pnpm --filter=@theokit/ui quality:knip
      - run: pnpm --filter=@theokit/ui registry:check
      - run: pnpm --filter=@theokit/ui registry:validate
      - run: pnpm --filter=@theokit/ui quality:structure
      - run: pnpm --filter=@theokit/ui classify:check
      - run: pnpm --filter=@theokit/ui quality:contrast
      # The published-manifest contract, checked instead of remembered. Audited across 50
      # packages on 2026-09-01: 38 did not export "./package.json" — reproduced as
      # `ERR_PACKAGE_PATH_NOT_EXPORTED` against a real tarball — 30 had no keywords and 18
      # declared no sideEffects at all.
      #
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
      # caller without nine pull requests, which is the reason that repo exists.
      - name: Published manifests satisfy the contract
        uses: usetheokit/shared-workflows/actions/manifest-check@v1 # zizmor: ignore[unpinned-uses]

  unit:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - run: pnpm --filter=@theokit/ui test

  package:
    permissions:
      contents: read
    name: Build + package contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - run: pnpm --filter=@theokit/ui build
      - run: pnpm --filter=@theokit/ui test:contract
      - run: pnpm --filter=@theokit/ui validate:packaged
      - run: pnpm --filter=@theokit/ui quality:publint
      - run: pnpm --filter=@theokit/ui quality:bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: packages/ui/dist
          retention-days: 1

  browser:
    permissions:
      contents: read
    name: Browser + stories
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      # `quality:visual` reads the real `dist/components.css` rather than a fixture, because the
      # defect it guards was in what ships. Locally `quality:gates` builds first; this job runs
      # `quality:visual` directly, so the dist has to arrive from the job that produced it.
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ui-dist
          path: packages/ui/dist
      - name: Install Playwright Chromium
        working-directory: packages/ui
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter=@theokit/ui quality:a11y
      - run: pnpm --filter=@theokit/ui quality:visual
      - run: pnpm --filter=@theokit/ui ladle:build

  dogfood:
    permissions:
      contents: read
    name: Dogfood scaffolds
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ui-dist
          path: packages/ui/dist
      - run: pnpm --filter=@theokit/ui dogfood:whiteboard
      - run: pnpm --filter=@theokit/ui dogfood:slide
      - run: pnpm --filter=@theokit/ui dogfood:slide-deck
      - run: pnpm --filter=@theokit/ui dogfood:slide-rich
      - run: pnpm --filter=@theokit/ui dogfood:v4-zero-config
      - run: pnpm --filter=@theokit/ui dogfood:precompiled-utilities

  # T6.3 (agent-team-audit-fixes plan): React 19 compatibility job.
  # Overrides React to 19.x over the locked tree, then runs typecheck +
  # test to surface incompatibilities. `continue-on-error: true` means
  # failures here do NOT block the PR — we gather evidence first, then
  # decide whether to promote it to a required check. The peer range
  # `"react": ">=18.2.0"` already permits 19 numerically; this proves
  # the library actually compiles and tests against it.
  react-19-compat:
    permissions:
      contents: read
    name: react@19 compat (allow-failure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # Forward-compatibility is signal rather than a merge gate; run it once after integration
    # instead of resolving an unlocked dependency tree for every pull request.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
      # caller without nine pull requests, which is the reason that repository exists. What the
      # action RUNS stays pinned: every action inside it by digest, and the package manager by
      # this repository's manifest.
      #
      # It replaces the pnpm/setup-node pair verbatim, including the part most likely to be lost
      # in a hand rewrite: `cache-dependency-path` lists `package.json` beside `pnpm-lock.yaml`,
      # because setup-node keys the pnpm store on the lockfile alone — so a pnpm 9 → 10 bump
      # leaves the key identical and the job restores a store the new pnpm reads as inconsistent
      # (`ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list).
      #
      # `install: false` because this job does its OWN install below, deliberately and
      # differently. A frozen install here would resolve the tree twice and the second one would
      # undo the first.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          install: 'false'

      # React 19 is pinned into package.json and BOTH the lockfile and node_modules are
      # removed, so the tree resolves from scratch with the overrides already in place.
      #
      # Every cheaper variant was tried and measured, and each left TWO copies of
      # @types/react — 18.3.28 for `@usetheo/ui`'s peer alongside 19.2.18 at the root:
      #
      #   pnpm add -D react@^19 ...                        -> 2 copies   (the original)
      #   + pnpm.overrides, install over the lockfile      -> 2 copies
      #   + delete pnpm-lock.yaml, keep node_modules       -> 2 copies
      #   + delete node_modules as well                    -> 1 copy     OK
      #
      # pnpm does not prune a store entry that an existing node_modules still points at, so
      # the stale resolution survives everything short of removing it. Two copies means two
      # `ReactNode` unions, and every value crossing between them fails to assign — which is
      # what produced five phantom `bigint` errors here for months, while hiding 21 real
      # ones. See usetheokit/theokit-ui#45.
      #
      # There is no separate baseline install: this job never uses the locked tree, and
      # installing one only to delete it wasted a minute per run.
      #
      # The trade-off is deliberate. Resolving afresh means this is not byte-for-byte the
      # tree that ships — which is what a compatibility probe wants, since the question is
      # whether this SOURCE works against React 19, not whether today's lockfile does. The
      # shipping tree is what `quality:gates` verifies, on the locked install, in the job
      # above.
      - name: Install with React 19 across the whole tree
        run: |
          # In a subshell rather than `pnpm --dir packages/ui`: `pnpm pkg` takes no
          # directory flag and swallows the value as a command name, failing with
          # `Command "packages/ui" not found` (measured, run 32776375180).
          ( cd packages/ui && pnpm pkg set \
            "devDependencies.react=^19" \
            "devDependencies.react-dom=^19" \
            "devDependencies.@types/react=^19" \
            "devDependencies.@types/react-dom=^19" )
          # `pnpm.overrides` is only honoured in the workspace-root manifest. Setting it
          # on the package would be accepted and then ignored — the job would go green
          # over a tree that never saw React 19.
          pnpm pkg set \
            "pnpm.overrides.react=^19" \
            "pnpm.overrides.react-dom=^19" \
            "pnpm.overrides.@types/react=^19" \
            "pnpm.overrides.@types/react-dom=^19"
          # Pin every OTHER peer to what the lockfile resolved, so this job changes exactly
          # one variable. Dropping the lockfile re-resolves the whole graph, which quietly
          # turned this into a "React 19 + newest everything" probe: CI picked
          # @usetheo/ui@0.35.1 where the lockfile pins 0.22.0, and the failure that produced
          # was a real defect about peer drift (#50) wearing a React 19 label. One job, one
          # question.
          USETHEO_UI=$(grep -A2 "'@usetheo/ui':" pnpm-lock.yaml | grep 'version:' | head -1 | sed 's/.*version: //; s/(.*//')
          if [ -z "$USETHEO_UI" ]; then
            echo "::error::Could not read the locked @usetheo/ui version from pnpm-lock.yaml. Refusing to resolve it freely — that would make this job test more than React 19."
            exit 1
          fi
          echo "Pinning @usetheo/ui to the locked $USETHEO_UI"
          pnpm pkg set "pnpm.overrides.@usetheo/ui=$USETHEO_UI"

          rm -rf pnpm-lock.yaml node_modules
          pnpm install --no-frozen-lockfile

      - name: Assert a single copy of @types/react
        run: |
          # `find -maxdepth 1` rather than `ls`: ls formats for a human and its output
          # cannot be counted safely once a name carries a space or a newline. These
          # names never do, but the gate should not depend on that staying true.
          copies=$(find node_modules/.pnpm -maxdepth 1 -name '@types+react@*' | wc -l)
          echo "@types/react copies in the tree: $copies"
          find node_modules/.pnpm -maxdepth 1 -name '@types+react@*' || true
          if [ "$copies" -ne 1 ]; then
            echo "::error::Expected exactly 1 copy of @types/react; found $copies. Any type error below would be an artifact of the install, not a React 19 finding."
            exit 1
          fi

      - name: Typecheck against React 19
        run: pnpm --filter=@theokit/ui run typecheck

      - name: Test against React 19
        run: pnpm --filter=@theokit/ui run test

  # The one check branch protection should require.
  #
  # Requiring individual jobs works only while each runs on every event. The moment a job becomes
  # conditional — a matrix leg skipped on pull requests, a path filter, an allow-failure lane — a
  # required check that never reports sits at "Expected — Waiting for status to be reported" and
  # the pull request can never merge. Branch protection cannot tell "deliberately skipped" from
  # "not reported yet". A sibling repository hit exactly that and had to revert rather than fix.
  #
  # A SKIPPED dependency counts as a pass; a failed or cancelled one does not. `cancelled` is
  # checked too, or the concurrency group's own cancellations would report green.
  #
  # `react-19-compat` is deliberately NOT in `needs`: it is an allow-failure lane, and gating on
  # it would turn a forward-compatibility signal into a merge blocker.
  ci-ok:
    permissions: {}
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [static, unit, package, browser, dogfood, release-channel]
    steps:
      # Was an inline grep over the serialized results, duplicated in four repositories.
      # It read only `failure` and `cancelled`, so a job that SKIPPED counted as a pass —
      # and a job that did not run reads exactly like one that did. The shared action
      # fails on an undeclared skip, and one implementation replaces four.
      #
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach
      # every caller without nine pull requests, which is the reason that repo exists.
      - uses: usetheokit/shared-workflows/actions/checks-pass@v1 # zizmor: ignore[unpinned-uses]
        with:
          needs: ${{ toJSON(needs) }}

  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every caller
      # without seven pull requests, which is the reason that repository exists.
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]
