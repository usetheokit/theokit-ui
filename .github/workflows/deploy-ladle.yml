name: Deploy Ladle catalog

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/src/**"
      - "packages/ui/.ladle/**"
      - "packages/ui/package.json"
      - "packages/ui/wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-ladle.yml"
  workflow_dispatch: {}

# `contents: read` and nothing else at the workflow level. `deployments: write` moved onto the
# job that performs the deploy, so it is not the default for every job this file might later
# gain. zizmor reports the workflow-level grant as `excessive-permissions`, high.
permissions:
  contents: read

concurrency:
  group: deploy-ladle-${{ github.ref }}
  # A cancelled run on an integration branch leaves the commit with no verdict,
  # which reads the same as a passing one. Only supersede elsewhere.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  deploy:
    # The environment exists for its DEPLOYMENT BRANCH POLICY, restricted to `main`. This
    # workflow carries `workflow_dispatch: {}`, so before the policy anyone with write access
    # could dispatch it from an arbitrary branch and the job would hold the Cloudflare deploy
    # credentials there. The policy makes the job unrunnable outside `main`.
    #
    # The credentials themselves stay repository secrets -- their values are write-only, so
    # nothing could copy them into the environment. What is bought is the branch policy, not
    # secret isolation.
    environment: ladle
    # The write this job actually performs, declared where it is used rather than inherited.
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Hoisted so the deploy step can be gated on their presence — `secrets` is
      # not available in a step-level `if`, but `env` is.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `@v1` is a moving ref by design; what the action RUNS stays pinned by digest inside it,
      # Node from `.nvmrc`, pnpm from `packageManager` (naming it twice is what produces
      # ERR_PNPM_BAD_PM_VERSION). The frozen install is the action's default, so the separate
      # step is gone. The cache-poisoning suppression goes with the raw `setup-node` it annotated:
      # the store is keyed on the lockfile and only written by runs on `main`, which is the branch
      # this workflow triggers on, so a pull request cannot seed the entry this job restores.
      #
      # THE THIRD CACHE PATH IS DROPPED ON PURPOSE. This block also keyed on
      # `packages/ui/package.json`. Measured over the last twenty commits touching that file, 19
      # changed it WITHOUT touching the lockfile — but what they changed was `"version"` (a release
      # bump) or `"sideEffects"`. Neither alters the pnpm store, which holds external dependencies
      # keyed by their own versions. The third path was discarding a warm store on every release
      # and protecting nothing.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]

      - name: Verify story coverage (EC-5 + drift gate)
        working-directory: packages/ui
        run: |
          pnpm inventory
          pnpm stories:check

      - name: Build Ladle
        # EC-14 absorbed: build runs in the workflow before any deploy step.
        # Without this, pages would deploy stale ./build/ from git history.
        working-directory: packages/ui
        run: pnpm ladle:build

      # `cloudflare/pages-action` was archived by Cloudflare with the notice
      # "DEPRECATED, please use wrangler-action". An archived action receives no
      # fix if it breaks against the Pages API, and it was the one reference here
      # that a tag could still move under. `wrangler-action` is the replacement
      # Cloudflare names; it takes the same deploy as a `wrangler pages deploy`
      # command rather than as inputs.
      #
      # The project name must match the project on the Cloudflare side. This
      # deploy has never run successfully — the repository has no `CLOUDFLARE_*`
      # secrets — so the name below is unverified against any real project.
      # Confirm it (or the renamed `theokit-ui`) when wiring the credentials.
      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        # The pin is a git commit SHA, not a credential — but forty hex characters next to the
        # word `cloudflare` matches TruffleHog's CloudflareApiToken detector, which cannot tell
        # the two apart. Silenced on the line, never on the file, so a real credential added to
        # this workflow later is still caught.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0 trufflehog:ignore
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/ui
          command: pages deploy build --project-name=theo-ui

      # Without this the job failed on every single run (16/16) for a missing
      # secret, which trains everyone to ignore a red catalog build. The story
      # coverage gate and the Ladle build above are the parts that catch real
      # regressions; they now report honestly on their own.
      - name: Report skipped deploy
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "::notice title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not configured on this repository. The catalog was built and the story-coverage gate passed; only the upload was skipped."
