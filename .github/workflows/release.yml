name: Release

# theokit-ui: `@theokit/ui`. Changesets-driven release, matching the other publishable
# repositories in the framework (theokit-sdk, -di, -plugins, -studio, -gateways).
#
# WHAT THIS REPLACED, and why the replacement is not cosmetic. The previous workflow fired
# on a `v*` tag and ran `npm publish` against whatever version happened to be in the
# manifest. That put the version number, the git tag and the published artifact in three
# different hands, and they drifted: measured 2026-08-21, npm served 1.4.0 and 1.4.1 while
# git's newest tag was v1.3.2 — two releases with no tag, no GitHub release and no
# provenance, and a next cut that would have computed a colliding v1.4.0
# (usetheokit/theokit-ui#46).
#
# Under changesets the version is DERIVED, not typed: contributors add a changeset file
# describing the change and its bump, changesets opens a "Version Packages" pull request
# that applies them, and merging that pull request is what publishes and tags. One input,
# one output, no third place to forget.
#
# AUTHENTICATION IS OIDC, NOT A TOKEN. `@theokit/ui` carries a Trusted Publisher connection
# on npmjs.com naming this repository and THIS FILE. npm mints a short-lived credential
# scoped to that package; it cannot be exported or replayed. Renaming this file, or
# publishing from any other workflow, breaks the trust and the publish is rejected — that
# is the point of it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Written in map form only to state the second line. The scalar form defaults to
# `cancel-in-progress: false`, which is already what a release needs -- but the default is silent,
# and a linter that cannot tell "chose false" from "never considered it" flags it on every audit.
#
# `false` is the whole point, and it is the opposite of a CI leg. Cancelling a superseded CI run
# discards a verdict nobody will read. Cancelling a superseded RELEASE run discards a half-finished
# publish: versions bumped and committed but not published, or published with no tag and no release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # Read the tree; the publishing job below declares its own wider scope.

jobs:
  # The last line, for the path that reached a release without passing through a pull request.
  # If the declared channel and `.changeset/pre.json` disagree, this release would publish under
  # the wrong dist-tag — most expensively, a stable version onto `latest` after an accidental
  # `changeset pre exit`, with the publish reporting success.
  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Read the tree; the publishing job below declares its own wider scope.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]

  release:
    needs: release-channel
    name: Release via Changesets (theokit-ui)
    # The environment exists for its DEPLOYMENT BRANCH POLICY, which is restricted to `main`.
    #
    # That is not decoration. This workflow carries `workflow_dispatch`, so before the policy
    # existed anyone with write access could dispatch it from an arbitrary branch and the job
    # would mint a release App token there. The policy makes the job unrunnable outside `main`,
    # which is the only branch a release may be cut from anyway.
    #
    # NO reviewer gate: a solo-maintainer repository cannot satisfy an approval gate, and a gate
    # only its author can bypass teaches bypassing. The environment carries one rule.
    #
    # The App credentials stay ORGANIZATION secrets rather than moving in here: an org secret
    # cannot be scoped to a repository environment, and their values are write-only, so nothing
    # could copy them. The protection bought is the branch policy, not secret isolation -- said
    # plainly because `environment:` is easy to mistake for the second.
    environment: release
    runs-on: ubuntu-24.04
    # A ceiling well under GitHub's 6-hour default keeps a wedged job from holding a
    # runner, and this is the job it costs the most to leave open.
    timeout-minutes: 30
    permissions:
      contents: write # changesets opens and updates the version pull request, and pushes its tags.
      pull-requests: write # Open and update the "Version Packages" pull request.
      id-token: write # OIDC for npm trusted publishing; with no token, this is the only credential.
    steps:
      # Mint a short-lived token from the `theokit-release` GitHub App instead of using
      # the job's own GITHUB_TOKEN. This exists for ONE reason: GitHub does not start
      # workflow runs from GITHUB_TOKEN-authored events, so the Version Packages pull
      # request opened by changesets arrived with none of the required checks running,
      # permanently BLOCKED until a person closed and reopened it to re-trigger them.
      #
      # An App token is authored by the App, not by the Actions bot, so the events it
      # creates DO start workflows. The token is minted per run and expires with it; what
      # is long-lived is the App's private key, held as a secret, scoped to exactly three
      # repository permissions (contents, pull-requests, metadata) on this repository
      # alone. That is the cost, and it is smaller than a personal access token: it is
      # attached to no human, and revoking it breaks nobody's access to anything else.
      #
      # NOT used for npm. Publishing stays OIDC trusted publishing, with no token at all.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to what this job does, rather than inheriting whatever the
          # installation happens to hold. The App is scoped to these two today, so the
          # lines look redundant — they are not: they are what keeps a later widening of
          # the App from silently widening this job too. zizmor flags the unrestricted
          # form as high severity for exactly that reason.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # The one checkout in this repository that keeps its credential, and not by
          # oversight: changesets/action pushes the version commit and the release tags
          # with the git CLI, which authenticates from exactly this persisted token.
          # `persist-credentials: false` breaks the release.
          #
          # It must be the APP's token, not the default one. The push of
          # `changeset-release/main` is what the pull request is opened against, so a push
          # carrying the Actions bot's credential produces a bot-authored branch and the
          # checks stay dormant even though the pull request itself was opened by the App.
          # Both halves have to be the App or neither is.
          token: ${{ steps.app-token.outputs.token }}
          #
          # changesets reads tags to decide what is unpublished; a shallow clone hides them.
          fetch-depth: 0

      # `@v1` is a moving ref by design; what the action RUNS stays pinned by digest inside it,
      # Node from `.nvmrc`, pnpm from `packageManager`. It carries the cache key this block
      # spelled out — `package.json` beside `pnpm-lock.yaml`, so a pnpm major bump invalidates the
      # store instead of restoring one the new pnpm reads as inconsistent.
      #
      # THE THIRD CACHE PATH IS DROPPED ON PURPOSE. This block also keyed on
      # `packages/ui/package.json`, and measured over the last twenty commits touching that file,
      # 19 changed it WITHOUT touching the lockfile — but what they changed was `"version"` (a
      # release bump) or `"sideEffects"`. Neither alters the pnpm store, which holds external
      # dependencies keyed by their own versions. So the third path was discarding a warm store on
      # every release and protecting nothing. Dropping it is a small win, not a loss.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          install: 'false'
          # NO `registry-url`. It looks harmless and is not: setup-node writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an npmrc
          # UNCONDITIONALLY and points NPM_CONFIG_USERCONFIG at it, then exports
          # NODE_AUTH_TOKEN only if the caller supplied one — which, under OIDC, nobody
          # does. The job would publish with a config declaring a credential that does not
          # exist. registry.npmjs.org is already the default, and `publishConfig.access:
          # public` in the manifest already covers the scope.

      # THE STEP WITHOUT WHICH THE OIDC CONFIGURATION IS CORRECT AND USELESS. setup-node
      # ships whatever npm the Node release bundles, and Node 22 bundles npm 10.9.7. OIDC
      # needs npm >= 11.5.1: an older npm has no OIDC code at all, never presents the token,
      # publishes unauthenticated, and the registry answers `E404 Not Found - PUT`. It
      # returns 404 rather than 403 so it does not reveal that a package exists to someone
      # who cannot publish it — which reads as "the package does not exist" and sends you
      # hunting for a typo instead of a CLI too old to use a binding. That is exactly what
      # every run of the previous workflow did (usetheokit/theokit-ui#46).
      #
      # Pinned exactly, and NOT to 12.x. npm 12 breaks this release path in two places, and
      # the quiet one is the dangerous half:
      #   1. It rejects the `--no-git-checks` flag changesets passes through, with
      #      EUNKNOWNCONFIG, where every earlier npm ignored it.
      #   2. It returns an ARRAY from `npm info --json` where earlier npm returned an
      #      object. changesets reads `response.pkgInfo.versions || []`; on an array that is
      #      `undefined`, the list of published versions comes back empty, every package
      #      looks unpublished, and nothing errors — it just tries to publish everything.
      # 11.9.0 is the newest npm that clears the OIDC floor and avoids both. Measured in
      # theokit-di; see that repository's release.yml for the numbers.
      - name: Install an npm that speaks OIDC (>= 11.5.1) but tolerates the publish flags
        uses: usetheokit/shared-workflows/actions/npm-oidc@v1 # zizmor: ignore[unpinned-uses]

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm install` runs the root `prepare` script, which points core.hooksPath at
      # `.githooks` — so the pre-commit secret scan is armed on this runner. changesets then
      # runs `git commit -m "Version Packages"`, the hook fires, finds no `trufflehog`
      # binary, and fails closed exactly as designed.
      #
      # The hook is right to fail closed and wrong to be armed here. It exists for the
      # commit a PERSON makes: CI can only catch a credential once it is already in the
      # history, and the hook is the last point where a leak is still free to fix. This
      # commit is made by a bot, from files it generated out of content already in the
      # repository, onto `changeset-release/main` — which reaches `main` only through a pull
      # request, where this repository's own gates run.
      #
      # `|| true` because --unset exits 5 when the key is absent, and an absent key is
      # already the state this step wants.
      - name: Disarm the local pre-commit hook for the bot's version commit
        run: git config --unset core.hooksPath || true

      # THE VERSION PULL REQUEST OPENS WITH NO CHECKS RUNNING, AND THAT IS NOT A BUG.
      # changesets opens it with `secrets.GITHUB_TOKEN`, and GitHub deliberately does not
      # start workflow runs from GITHUB_TOKEN-authored events — otherwise a workflow could
      # trigger itself forever. So the Version Packages pull request appears with only the
      # external GitHub Apps reporting (Socket here); TruffleHog, actionlint and
      # `Verify (quality gates)` never fire on their own.
      #
      # The pull request is therefore BLOCKED rather than green-and-mergeable: those three
      # are required checks on `main`, and a required check that never reports cannot be
      # satisfied. A person releases the runs — closing and reopening the pull request is
      # the usual gesture, and re-triggers them as a human-authored event.
      #
      # Keep it that way. The obvious "fix" is to hand this action a personal access token
      # so the pull request looks human-authored and the checks fire by themselves; that
      # puts a long-lived credential back into the job that publishes to npm, which is the
      # thing OIDC was adopted to remove. One manual gesture per release is the cheaper
      # side of that trade.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          # The App's token, so the Version Packages pull request is authored by the App and
          # its required checks actually run. With `secrets.GITHUB_TOKEN` here the pull
          # request opens BLOCKED with nothing but the external Apps reporting, and stays
          # that way until a person closes and reopens it. Nothing here authenticates to npm.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # NPM_CONFIG_PROVENANCE is deliberately absent: `publishConfig.provenance: true`
          # already sits in packages/ui/package.json, beside the package it describes,
          # instead of in an environment variable this file has to remember. Unlike
          # theokit-studio, this repository is PUBLIC, so npm will attest — the E422 that
          # forces provenance off for a private source does not apply here.
